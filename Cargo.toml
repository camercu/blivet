[package]
name = "blivet"
version = "0.13.0"
edition = "2021"
rust-version = "1.85"
description = "A correct, full-featured Unix daemon library and CLI for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/camercu/blivet"
documentation = "https://docs.rs/blivet"
readme = "README.md"
keywords = ["daemon", "daemonize", "fork", "unix", "linux"]
categories = ["os::unix-apis"]
# Allowlist what ships to crates.io (default-deny): the library, the
# `daemonize` binary, the build script, the runnable example, and the
# legal/readme/changelog files. README.md is required — src/main.rs embeds it
# via include_str!. build.rs is required — it resolves the capability `cfg`
# aliases every platform branch gates on, so without it every branch takes the
# unknown-Unix fallback. docs/SPEC.md ships so a vendored copy carries the
# numbered requirements its tests cite. Cargo.toml and Cargo.lock are packaged
# automatically.
include = [
    "/src/**/*.rs",
    "/build.rs",
    "/examples/**/*.rs",
    "/README.md",
    "/docs/SPEC.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[[bin]]
name = "daemonize"
path = "src/main.rs"
required-features = ["cli"]

# The `daemonize` binary is the only thing that needs an argument parser, and
# clap's subtree is 13 of the 24 crates a library-only consumer would otherwise
# compile. `cli` is on by default so `cargo install blivet` and docs.rs are
# unaffected; a library consumer turns it off with `default-features = false`.
[features]
default = ["cli"]
cli = ["dep:clap"]

[package.metadata.docs.rs]
# Render the capability-gated paths for the supported Unix targets, not just
# the default Linux build. OpenBSD is omitted: it is a tier-3 target without a
# prebuilt std for docs.rs to build against.
default-target = "x86_64-unknown-linux-gnu"
targets = [
    "aarch64-linux-android",
    "x86_64-apple-darwin",
    "x86_64-unknown-freebsd",
    "x86_64-unknown-netbsd",
]

[dependencies]
nix = { version = "0.31", features = ["fs", "signal", "process", "user", "resource"] }
clap = { version = "4", features = ["derive"], optional = true }
thiserror = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
relentless = "0.17"
signal-hook = "0.4"
mutants = "0.0.4"
