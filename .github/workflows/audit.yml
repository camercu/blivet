name: Audit

# The advisory database moves on its own: a new RUSTSEC entry turns
# `cargo deny check` red with no change to this repository. CI runs it on
# every push, but a quiet repository may see none for weeks, and the advisory
# then first shows as a red check on an unrelated change. This finds it the
# day it lands, in a job whose name says where the fault is.
#
# Runs `just lint-deny` in the nix shell, so the recipe stays the one
# definition of the supply-chain gate and cargo-deny is the pinned version.
on:
  schedule:
    # Daily, off the top of the hour to miss the scheduler's queue.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Check advisories, licenses, bans and sources
        run: nix-shell --run 'just lint-deny'
