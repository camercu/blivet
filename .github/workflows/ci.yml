name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_LOCKED: --locked
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ── Fast tier ──────────────────────────────────────────────

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@cargo-deny
      - name: CI
        run: just ci

  # Proves the crate still *compiles* on its MSRV. It cannot prove dependency
  # rust-version declarations fit: cargo 1.85 predates the resolver diagnostic
  # and builds a dep demanding 1.93 without complaint. `just msrv-check` (in
  # the `ci` job) is what enforces the declarations.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - name: Test on MSRV
        run: just test

  docker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just
      - name: Docker test
        run: just docker-test

  # Tier 2 of the Android support ladder (docs/adr/0002): the library tests on
  # real bionic and the real dynamic linker, on a host Linux kernel. Tier 1 is
  # the Android type-check inside `just check-cross`; tier 3 is the emulator
  # smoke, which is what covers the Android kernel and SELinux.
  termux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just
      - name: Bionic (Termux) library tests
        run: just termux-test

  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: lcov.info

  manpage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Check manpage is up to date
        run: |
          nix-shell --run 'just manpage'
          git diff --exit-code docs/daemonize.1 || {
            echo "::error::docs/daemonize.1 is out of date. Run 'just manpage' and commit."
            exit 1
          }

  # nix-shell pins cargo-public-api (shell.nix) and the justfile pins the
  # nightly that renders rustdoc JSON, so CI diffs the snapshot with the
  # exact toolchain that blessed it — either drifting would cause false
  # alarms (e.g. io::Error's path moving from std to core between nightlies).
  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Check public API matches committed snapshot
        run: nix-shell --run 'just public-api-toolchain public-api-check'

  release-config:
    # The Release workflow only runs after CI passes, so a dependency bump
    # that breaks note rendering fails here, on its own PR, not at release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: node scripts/check-release-config.mjs

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Validate PR commits
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  # ── Slow tier (VM-based smoke tests) ──────────────────────

  bsd-smoke:
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: freebsd
            version: '14.2'
          - name: openbsd
            version: '7.8'
    runs-on: ubuntu-latest
    name: smoke (${{ matrix.os.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: cross-platform-actions/action@v1
        with:
          operating_system: ${{ matrix.os.name }}
          version: ${{ matrix.os.version }}
          shell: sh
          run: |
            set -eu

            # Install Rust: OpenBSD uses system packages (Tier 3, no rustup binaries);
            # FreeBSD has rustup support.
            case "$(uname)" in
              OpenBSD)
                sudo pkg_add rust
                ;;
              *)
                curl --proto '=https' --tlsv1.2 -sSf --retry 3 --retry-delay 5 https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
                . "$HOME/.cargo/env"
                ;;
            esac

            cargo build --locked
            PIDFILE="/tmp/daemonize-smoke-$$.pid"
            ./target/debug/daemonize -p "$PIDFILE" -- sleep 30
            i=0
            while [ "$i" -lt 10 ]; do
              [ -f "$PIDFILE" ] && break
              sleep 1
              i=$((i + 1))
            done
            test -f "$PIDFILE" || { echo "FAIL: pidfile not created"; exit 1; }
            PID=$(cat "$PIDFILE")
            kill -0 "$PID" || { echo "FAIL: daemon not running"; exit 1; }
            kill "$PID"
            echo "PASS: smoke test on ${{ matrix.os.name }}"

            # Run the library unit tests natively so the daemonize_checked
            # thread-count path (sysctl on the BSDs) is proven on this OS.
            cargo test --locked --lib
            echo "PASS: library tests on ${{ matrix.os.name }}"

  # Tier 3 of the Android support ladder (docs/adr/0002), and the only tier with
  # a real Android kernel and SELinux: the daemonize sequence itself — fork,
  # setsid, pidfile, signal — proven on a booted emulator. Slowest job in the
  # matrix and the likeliest to flake, hence the slow tier; if it proves too
  # flaky, `cross test --target aarch64-linux-android` trades the real kernel
  # for far less plumbing.
  android-smoke:
    runs-on: ubuntu-latest
    name: smoke (android)
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      # Hardware acceleration is available on standard hosted runners, but the
      # kvm device is not world-accessible by default; without this the
      # emulator falls back to software rendering and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cross-compile for Android
        run: |
          # cargo-ndk looks for ANDROID_NDK_HOME; the runner image exports the
          # NDK it ships under different names.
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          cargo ndk -t x86_64 build --locked
          cargo ndk -t x86_64 test --locked --lib --no-run
      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          script: ./scripts/android-smoke.sh

  # NetBSD 10.1 ships Rust 1.82, below our MSRV (1.85). Cross-compile on the
  # Ubuntu host and run the binary inside the VM.
  netbsd-smoke:
    runs-on: ubuntu-latest
    name: smoke (netbsd)
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-netbsd
      - name: Download NetBSD sysroot
        run: |
          mkdir -p /tmp/netbsd-sysroot
          for set in base comp; do
            curl -fL --retry 3 --retry-delay 5 "https://cdn.netbsd.org/pub/NetBSD/NetBSD-10.1/amd64/binary/sets/${set}.tar.xz" \
              | sudo tar xJf - -C /tmp/netbsd-sysroot
          done
      - name: Cross-compile for NetBSD
        env:
          CARGO_TARGET_X86_64_UNKNOWN_NETBSD_LINKER: clang
          CARGO_TARGET_X86_64_UNKNOWN_NETBSD_RUSTFLAGS: >-
            -C link-arg=--target=x86_64-unknown-netbsd
            -C link-arg=--sysroot=/tmp/netbsd-sysroot
            -C link-arg=-fuse-ld=lld
        run: |
          cargo build --locked --target x86_64-unknown-netbsd
          # Cross-build the library test harness too, to run inside the VM, and
          # record the path cargo actually produced. A glob over deps/ resolves
          # to whatever sorts first, which need not be this build's artifact.
          # The path is relative so it still resolves inside the VM.
          cargo test --no-run --locked --lib --target x86_64-unknown-netbsd \
            --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable) | .executable' \
            | sed "s|^$PWD/||" > testbin-path.txt
          if [ "$(wc -l < testbin-path.txt)" -ne 1 ]; then
            echo "expected exactly one test binary, got:"; cat testbin-path.txt; exit 1
          fi
      - name: Run smoke test in NetBSD VM
        uses: cross-platform-actions/action@v1
        with:
          operating_system: netbsd
          version: '10.1'
          shell: sh
          run: |
            set -eu
            PIDFILE="/tmp/daemonize-smoke-$$.pid"
            ./target/x86_64-unknown-netbsd/debug/daemonize -p "$PIDFILE" -- sleep 30
            i=0
            while [ "$i" -lt 10 ]; do
              [ -f "$PIDFILE" ] && break
              sleep 1
              i=$((i + 1))
            done
            test -f "$PIDFILE" || { echo "FAIL: pidfile not created"; exit 1; }
            PID=$(cat "$PIDFILE")
            kill -0 "$PID" || { echo "FAIL: daemon not running"; exit 1; }
            kill "$PID"
            echo "PASS: smoke test on netbsd"

            # Run the whole cross-built library suite, which is what the
            # README's Supported tier claims of every platform in it — a single
            # filtered test would prove only the sysctl KERN_PROC2 thread-count
            # path. Routed through the vacuous-run guard so a harness that
            # matched nothing cannot report the claim as proven.
            TESTBIN=$(cat testbin-path.txt)
            test -x "$TESTBIN" || { echo "FAIL: test binary not found"; exit 1; }
            sh scripts/assert-tests-ran.sh "$TESTBIN"
            echo "PASS: library tests on netbsd"

  omnios-smoke:
    runs-on: ubuntu-latest
    name: smoke (omnios)
    steps:
      - uses: actions/checkout@v7
      - uses: cross-platform-actions/action@v1
        with:
          operating_system: omnios
          version: 'r151058'
          shell: bash
          run: |
            set -euo pipefail
            # rustup toolchains need a system linker; the OmniOS image ships
            # without one (pkg exit 4 = already installed / nothing to do).
            sudo pkg install build-essential || [ $? -eq 4 ]
            curl --proto '=https' --tlsv1.2 -sSf --retry 3 --retry-delay 5 https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            . "$HOME/.cargo/env"
            cargo build --locked
            PIDFILE="/tmp/daemonize-smoke-$$.pid"
            ./target/debug/daemonize -p "$PIDFILE" -- sleep 30
            for i in $(seq 1 10); do
              [ -f "$PIDFILE" ] && break
              sleep 1
            done
            test -f "$PIDFILE" || { echo "FAIL: pidfile not created"; exit 1; }
            PID=$(cat "$PIDFILE")
            kill -0 "$PID" || { echo "FAIL: daemon not running"; exit 1; }
            kill "$PID"
            echo "PASS: smoke test on omnios"
