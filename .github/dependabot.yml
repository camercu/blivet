# Dependabot keeps every dependency surface (cargo, GitHub Actions,
# npm devDependencies, pre-commit hooks) at supported versions
# without manual cargo update / npm update / pre-commit autoupdate
# chores. Weekly schedule trades freshness for review-fatigue floor.
#
# Conventional Commit type set to `chore(deps)` so semantic-release's
# commit-analyzer skips them (the `chore` type has no release rule in
# .releaserc.json, so Dependabot updates do not trigger releases).
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-deps:
        patterns: ["*"]
    ignore:
      # serial_test 4.x declares rust-version 1.93.1. The openbsd smoke job
      # runs `cargo test --locked --lib` against OpenBSD's packaged rust
      # (`pkg_add rust`, 1.90.0 as of OpenBSD 7.8) — Tier 3, no rustup — so a
      # 4.x dev-dep fails resolution there before any test runs.
      # Drop this ignore once OpenBSD packages rust >= serial_test's MSRV, and
      # raise `openbsd_rust` in the justfile in the same commit — `just
      # msrv-check` enforces that floor locally and in the `ci` job.
      - dependency-name: serial_test
        versions: [">=4.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-deps:
        patterns: ["*"]
    ignore:
      # The @1.85 ref on dtolnay/rust-toolchain *is* the MSRV declaration;
      # bumping it would silently change what the msrv job tests. Raise the
      # MSRV deliberately, in a commit that also updates Cargo.toml
      # rust-version.
      - dependency-name: dtolnay/rust-toolchain

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-deps:
        patterns: ["*"]
    ignore:
      # Preset 10 targets conventional-changelog-writer 9, but
      # @semantic-release/release-notes-generator 14 still uses writer 8, so
      # 10 publishes empty release notes (`just check-release-config` fails).
      # Drop this ignore once release-notes-generator moves to writer 9.
      - dependency-name: conventional-changelog-conventionalcommits
        versions: [">=10.0.0"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      pre-commit-deps:
        patterns: ["*"]
