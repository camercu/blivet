# cargo-mutants' profile (selected in .cargo/mutants.toml). A mutant that
# hangs a test — a blocked pipe reader, a loop that stops advancing — has that
# test killed, which fails it, so the mutant counts as caught and the rest of
# the suite still runs. If cargo-mutants' own timeout for the whole run fires
# first, the mutant still counts as caught (see .cargo/mutants.toml). The kill
# is not short on purpose: a 5s kill here once killed healthy tests on a
# loaded machine, which in a CI gate is a flake. Raise `period` if tests get
# legitimately slower.
[profile.mutants]
slow-timeout = { period = "10s", terminate-after = 2 }

# What `just test` runs under. The suite's own integration tests spawn the CLI
# and poll for a pidfile with a 30s bound, deliberately loose so a loaded
# machine does not fail a passing test (the poll returns the instant its
# condition holds, so the bound costs a healthy run nothing). Under a 5s kill,
# fourteen of them were killed mid-flight on a machine busy building
# containers — a flaky gate, which is the thing moving to nextest was meant to
# stop.
[profile.gate]
# Report a test as slow at the integration poll bound, kill it at four times
# that, so a genuinely hung test still cannot wedge the run.
slow-timeout = { period = "30s", terminate-after = 4 }

# What the privileged container tier runs under (scripts/privileged-test.sh).
# Same bounds as the gate: it runs a superset of the same tests, plus the
# ignored ones, on a container that is usually busier than a developer's shell.
[profile.privileged]
slow-timeout = { period = "30s", terminate-after = 4 }
