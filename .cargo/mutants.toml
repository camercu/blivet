# cargo-mutants configuration.
#
# Tests run under nextest with a 5s per-test kill timeout (see
# .config/nextest.toml): a mutant that hangs the suite (blocked pipe reader,
# loop that stops advancing) is killed by nextest well inside cargo-mutants'
# own auto timeout, and reports as a cleanly caught failure instead of
# TIMEOUT noise.
test_tool = "nextest"

# Unkillable false positives, excluded with reasons:
#
# Equivalent mutants: `|` over disjoint bitflag constants is value-identical
# to `^` (no shared bits), so no test can ever kill these. Scoped to the
# exact functions that OR constant flags; `|`→`&` is not excluded because it
# does change the value.
#
# The unsupported-target stubs are excluded too, but not from here: they carry
# `#[cfg_attr(test, mutants::skip)]` at the item instead. Each shares a name and
# a signature with the live implementation it stands in for, so a description
# cannot tell them apart and only a position could — and a position goes stale
# the moment the file above it grows. It did, twice: these exclusions read
# `36\d` against items that had moved to 358 and 426, and the re-pin then named
# each function's signature line while cargo-mutants names the first line of its
# body. An attribute travels with the code it excludes and cannot drift.
#
# The live `daemonize`'s `Ok(Default::default())` mutant is listed and not
# excluded: `DaemonContext` has no `Default`, so it does not compile and a sweep
# reports it as unviable rather than as a survivor. Nothing is hidden by leaving
# it in, and every entry below is then one honest category.
exclude_re = [
    # -- equivalent bitflag mutants --
    'replace \| with \^ in open_and_lock',
    'replace \| with \^ in plan_output_redirect',
    'replace \| with \^ in thread_count',
]
