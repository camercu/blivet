disallowed-methods = [
    { path = "nix::fcntl::open", reason = "may return a closed stdio slot that a later dup2 replaces; use steps::open_above_stdio (tests: allow it)" },
    { path = "nix::unistd::pipe", reason = "leaves both ends inheritable; use notify::channel (tests: test_support::make_pipe)" },
    { path = "libc::pipe", reason = "leaves both ends inheritable; use notify::channel (tests: test_support::make_pipe)" },
    { path = "libc::socketpair", reason = "only notify::channel makes the notification channel, close-on-exec (capability probes: allow it)" },
    { path = "nix::unistd::dup2_stdin", reason = "moves a stdio slot; only redirect_to_devnull and StdioSlot::dup2 may, and they assert test isolation" },
    { path = "nix::unistd::dup2_stdout", reason = "moves a stdio slot; only redirect_to_devnull and StdioSlot::dup2 may, and they assert test isolation" },
    { path = "nix::unistd::dup2_stderr", reason = "moves a stdio slot; only redirect_to_devnull and StdioSlot::dup2 may, and they assert test isolation" },
]
disallowed-macros = [
    { path = "std::eprintln", reason = "panics when the write fails, and a library error path then unwinds into the caller's code; use notify::print_on_stderr (CLI, tests, build script: allow it)" },
    { path = "std::println", reason = "panics when the write fails; the library prints nothing to stdout (CLI, tests, build script: allow it)" },
]
