# Markdown lint config (markdownlint-cli2), run by `just lint-markdown`.
config:
  # Prose wraps at 80 columns. Tables and fenced code cannot wrap at a column
  # without breaking, so they are exempt.
  MD013:
    tables: false
    code_blocks: false
  # Tables use `| cell |` spacing; pin the style so the "consistent" default
  # cannot be set by a single compact table elsewhere.
  MD060:
    style: "leading_and_trailing"
  # Adjacent blockquotes are separate notes, and GitHub renders them apart.
  MD028: false
  # Repeated subsection names are valid under distinct parents; only forbid
  # duplicates among direct siblings.
  MD024:
    siblings_only: true
globs:
  - "**/*.md"
ignores:
  - node_modules
  - target
  # Generated by semantic-release.
  - CHANGELOG.md
  # Agent tooling, worktrees and scratch trees, not project docs.
  - .claude
  - .harden
  - .spike-workspace
  - "mutants.out*"
